<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Site | Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- This header is common to all pages. -->
    <header class="header">
        <h1>My Blog</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="feed.html">Feed</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- This is the main content for the upload page. -->
    <main class="container">
        <section class="upload-form-card">
            <h2>Upload a New Blog Post</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea id="content" name="content" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Publish</button>
                </div>
            </form>
        </section>
    </main>

    <!-- This footer is common to all pages. -->
    <footer class="footer">
        &copy; 2025 My Blog. All rights reserved.
    </footer>

</body>
</html>
