<!DOCTYPE html>
<html>
<head>
    <title>Professional Details Form</title>
</head>
<body>
    <h1>Professional Details</h1>
    <form action="finalpage.html" method="get">

        <textbox>Previous Company:</textbox>
        <input type="text" name="company" required>
        <br><br>

        <textbox>Year of Joining:</textbox>
        <input type="number" name="year_joining" min="1900" max="2099" required>
        <br><br>

        <textbox>Year of Leaving:</textbox>
        <input type="number" name="year_leaving" min="1900" max="2099">
        <br><br>

        <textbox>Role/Designation:</textbox>
        <input type="text" name="role" required>
        <br><br>

        <textbox>Previous Salary:</textbox>
        <input type="text" name="salary" required>
        <br><br>

        <textbox>Skills/Expertise:</textbox>
        <input type="text" name="skills">
        <br><br>

        <input type="submit" value="Next">
        <input type="reset" value="Clear">
