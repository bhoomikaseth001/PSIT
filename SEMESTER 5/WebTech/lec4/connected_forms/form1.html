<!DOCTYPE>
<html>
    <head>
        <title>Personal Details Form</title>
        <body>
        <h1>Personal Details</h1>
        <form action = "form2.html" method = "get"  >
            <textbox>Full Name : </textbox>
            <input type="text" name="name" required>
            <br><br>

            <textbox>Email : </textbox>
            <input type="email" name = "email" required>
            <br><br>

            <textbox>Date of Birth :</textbox>
            <input type= "date" name="date" required>
            <br><br>

            <textbox>Gender: </textbox>
            <input type = "radio" name="gender" required>
            <textbox>Male</textbox>
            <input type = "radio" name="gender">
            <textbox>Female</textbox>
            <input type = "radio" name="gender">
            <textbox>Others</textbox>
            <br><br>
            
            <textbox>Phone Number</textbox>
            <input type="tel" name="phone" required>
            <br><br>

            <textbox>Address:</textbox><br>
            <textarea name="address" rows="3" cols="30" required></textarea><br><br>
            
            <textbox>Upload your photo:</textbox>
            <input type="file" name="photo" accept="image/*" required>
            <br><br>

            <input type="submit" value="Next">
            <input type="reset" value="Clear">
    </form>
   </body>
    






    </head>
</html>
